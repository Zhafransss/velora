name: tests

# Test isolasi tenant dan gerbang langganan memblokir merge/deploy bila gagal (FR-016).
# Aktifkan "Require status checks" pada branch main/development agar PR tidak bisa di-merge saat gagal.
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  pest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, gd, intl, pdo_sqlite, sqlite3, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Pest
        run: vendor/bin/pest
