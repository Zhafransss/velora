; Pengaturan PHP-FPM untuk Velora. Panduan: docs/DEPLOY-VPS.md (Fase 5).
; Pasang: sudo cp deploy/php/99-velora.ini /etc/php/8.3/fpm/conf.d/99-velora.ini && sudo systemctl restart php8.3-fpm

; Upload gambar dari admin (selaras dengan client_max_body_size 20M di Nginx).
upload_max_filesize = 20M
post_max_size = 25M

; Optimasi gambar (GD) memakai memori besar untuk foto kamera; browser admin sudah memperkecil sebelum upload.
memory_limit = 256M

expose_php = Off

; OPcache: kode tidak dicek ulang tiap request (lebih cepat). Setelah deploy WAJIB reload PHP-FPM
; (deploy/deploy.sh melakukannya), kalau tidak kode lama tetap dipakai.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
