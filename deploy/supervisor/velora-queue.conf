; Worker antrean Velora (Supervisor, Ubuntu). NFR-008: terpisah dari PHP-FPM, auto-restart, batas memori.
; Pasang: sudo cp deploy/supervisor/velora-queue.conf /etc/supervisor/conf.d/
;         sudo supervisorctl reread && sudo supervisorctl update
; Setiap deploy: php artisan queue:restart  (worker memuat kode saat mulai; tanpa ini kode lama tetap berjalan)
;
; Asumsi: kode di /var/www/velora, user www-data. Sesuaikan path/user dengan VPS.
;
; Kapasitas (perkiraan, belum diuji beban): satu pesan menahan worker AI ±1,5–5 dtk dan worker WhatsApp ±2–6 dtk
; (jeda anti-blokir konektor). 3 worker AI ~ 35–120 pesan/menit untuk semua tenant, sebelum batas token/menit penyedia
; AI (SRS R-09) — batas itu yang biasanya tercapai lebih dulu. Worker kebanyakan menunggu jaringan (AI/konektor),
; jadi CPU rendah; tiap worker ±50–80 MB RAM.
;
; Tambah numprocs bila widget admin "Antrean" sering menumpuk. Worker WhatsApp lebih dari jumlah nomor aktif tidak
; menambah kecepatan: konektor mengirim berurutan per nomor (FR-009.7).
;
; Penjadwal (penyapu pesan, retensi, backup) bukan bagian file ini; pasang cron:
;   * * * * * cd /var/www/velora && php artisan schedule:run >> /dev/null 2>&1

[program:velora-queue-ai]
command=php /var/www/velora/artisan queue:work database --queue=ai --tries=1 --timeout=130 --sleep=1 --max-time=3600 --memory=256
directory=/var/www/velora
user=www-data
numprocs=3
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
; > timeout job terpanjang (ProcessInboundMessage 120 dtk) agar job yang sedang berjalan selesai saat restart.
stopwaitsecs=150
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/velora/storage/logs/queue-ai.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:velora-queue-whatsapp]
; Juga melayani antrean default (notifikasi/email terantre, bila ada).
command=php /var/www/velora/artisan queue:work database --queue=whatsapp,default --tries=1 --timeout=100 --sleep=1 --max-time=3600 --memory=256
directory=/var/www/velora
user=www-data
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=120
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/velora/storage/logs/queue-whatsapp.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
