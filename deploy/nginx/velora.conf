# Nginx untuk Velora (website + /admin + /app) di VPS Ubuntu. Panduan: docs/DEPLOY-VPS.md (Fase 5).
# TEMPLATE: __DOMAIN__ diisi oleh deploy/nginx/install.sh (domain sementara sekarang, domain utama nanti).
# Pasang: sudo bash deploy/nginx/install.sh <domain> [--noindex]
# Sertifikat dibuat lebih dulu (certbot DNS-01 Cloudflare) di /etc/letsencrypt/live/<domain>/.

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;
    return 301 https://__DOMAIN__$request_uri;
}

# www -> domain utama (URL kanonik satu, baik untuk SEO)
server {
    # Nginx 1.24 (Ubuntu 24.04): http2 ditulis di baris listen (direktif terpisah baru ada sejak 1.25.1).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.__DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://__DOMAIN__$request_uri;
}

server {
    # Nginx 1.24 (Ubuntu 24.04): http2 ditulis di baris listen (direktif terpisah baru ada sejak 1.25.1).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    root /var/www/velora/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # Header keamanan (HSTS, X-Frame-Options, nosniff, dst.) dipasang aplikasi: App\Http\Middleware\HardenResponses.

    # Domain sementara: jangan diindeks Google (isi sama dengan domain utama = konten duplikat). Diaktifkan oleh
    # install.sh --noindex; baris tetap komentar untuk domain utama.
    # NOINDEX: add_header X-Robots-Tag "noindex, nofollow" always;

    # Upload gambar dari admin (Livewire menerima sampai 12 MB per file).
    client_max_body_size 20M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml application/xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Aset hasil build Vite: nama file ber-hash, aman di-cache 1 tahun.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # File statis lain. Jatuh ke Laravel bila file tidak ada: livewire.js dilayani lewat route Laravel.
    location ~* \.(?:css|js|woff2?|ttf|svg|ico|png|jpe?g|gif|webp)$ {
        expires 30d;
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # .env, .git, dll. tidak boleh pernah terbaca (kecuali .well-known).
    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# Internal: konektor WhatsApp -> webhook Laravel tanpa DNS/TLS (connector/.env WEBHOOK_URL=http://127.0.0.1:8080/webhooks/whatsapp).
# Hanya mendengar di 127.0.0.1, tidak terjangkau dari internet. Tanda tangan HMAC tetap diperiksa aplikasi.
server {
    listen 127.0.0.1:8080;
    server_name _;
    root /var/www/velora/public;

    location = /webhooks/whatsapp {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
    }

    location / {
        return 404;
    }
}
